# File: configs/default.yaml
# What this file does: Central YAML configuration file storing all default hyperparameters for ZeroFake
#   including backbone architecture, embedding_dim=128, num_fake_prototypes=6, contrastive temperature=0.07,
#   loss weights (lambda_1=0.5, lambda_2=0.2), open-set uncertainty weights (alpha=0.4, beta=0.3, gamma=0.3),
#   target_coverage=0.95, and Cloud GPU mixed-precision training parameters.
# Inputs: Loaded by main.py, losses/total_loss.py, training/train.py, and evaluation scripts.
# Outputs: Structured dictionary of project hyperparameters.

project_name: "ZeroFake"
seed: 42
holdout_generator: "NeuralTextures"

# Top-level flat aliases for direct convenience lookup
backbone: "convnext_tiny"
embedding_dim: 128
num_fake_prototypes: 6
temperature: 0.07
lambda_1: 0.5
lambda_2: 0.2
target_coverage: 0.95

data:
  raw_dir: "/content/raw_data/ffpp"
  processed_dir: "/content/data"
  drive_storage_dir: "/content/drive/MyDrive/ZeroFake_Storage"
  splits_path: "datasets/splits.json"
  manifest_path: "datasets/processed/frames_manifest.csv"
  image_size: 224
  num_frames_per_video: 16
  margin_scale: 1.3
  imagenet_mean: [0.485, 0.456, 0.406]
  imagenet_std: [0.229, 0.224, 0.225]

model:
  backbone: "convnext_tiny"
  backbone_name: "convnext_tiny"
  pretrained: true
  backbone_dim: 768
  hidden_dim: 256
  embedding_dim: 128
  embed_dim: 128
  num_fake_prototypes: 6
  dropout_p: 0.2
  proto_temp: 0.2

loss:
  lambda_1: 0.5          # Weight for Multi-Generator Supervised Contrastive Loss (L_con)
  lambda_2: 0.2          # Weight for Multi-Prototype Distance Loss (L_proto)
  temperature: 0.07      # Contrastive temperature tau
  proto_margin: 0.5      # Opposite-class prototype separation margin m
  lambda_div: 0.1        # Fake prototype diversity regularization weight

open_set:
  alpha: 0.4             # Weight for nearest-prototype cosine distance D_prototype(x)
  beta: 0.3              # Weight for predictive Shannon entropy H(p(y|x))
  gamma: 0.3             # Weight for Mahalanobis/cosine OOD feature distance S_OOD(x)
  target_coverage: 0.95      # Retain 95% of validation split samples when calibrating tau_reject
  target_val_coverage: 0.95  # Alias for target_coverage

training:
  mode: "zerofake"       # One of: baseline, contrastive, single_proto, zerofake
  batch_size: 64
  epochs: 15
  lr: 0.0001
  weight_decay: 0.0001
  mixed_precision: true  # Use PyTorch fp16 autocast + GradScaler on CUDA GPUs
  num_workers: 2
